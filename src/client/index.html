
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Assistente de Inteligência Artificial 18 Bits utilizando Google Gemini"
    >

    <title>Assistente de IA - 18 Bits</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header class="header">

        <div class="header-content">

            <div class="logo">

                <span class="logo-icon">
                    🤖
                </span>

                <div class="logo-text">

                    <h1>
                        Assistente de IA
                    </h1>

                    <span>
                        18 Bits
                    </span>

                </div>

            </div>


            <!-- BOTÃO TEMA -->

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Alternar tema"
            >
                ☀️
            </button>

        </div>

    </header>



    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <main class="main">

        <section class="chat-container">


            <!-- ==================================
                 TÍTULO
            =================================== -->

            <div class="chat-header">

                <div class="chat-icon">
                    ✨
                </div>

                <div>

                    <h2>
                        Converse com a Inteligência Artificial
                    </h2>

                    <p>
                        Faça uma pergunta e receba uma resposta utilizando o Google Gemini.
                    </p>

                </div>

            </div>



            <!-- ==================================
                 ÁREA DA PERGUNTA
            =================================== -->

            <div class="chat-form">

                <label
                    class="chat-label"
                    for="question"
                >
                    Sua pergunta:
                </label>


                <textarea
                    id="question"
                    name="question"
                    rows="6"
                    maxlength="2000"
                    placeholder="Digite sua pergunta aqui..."
                    autocomplete="off"
                ></textarea>


                <!-- CONTADOR -->

                <div class="input-footer">

                    <span class="char-counter">

                        <span id="charCount">
                            0
                        </span>

                        / 2000 caracteres

                    </span>

                </div>


                <!-- ==================================
                     BOTÕES
                =================================== -->

                <div class="button-container">

                    <button
                        id="btnquestion"
                        class="btn btn-primary"
                        type="button"
                        onclick="question()"
                    >
                        🤖 Perguntar
                    </button>


                    <button
                        id="btncleaner"
                        class="btn btn-secondary"
                        type="button"
                        onclick="cleaner()"
                    >
                        🗑️ Limpar
                    </button>

                </div>

            </div>



            <!-- ==================================
                 ÁREA DA RESPOSTA
            =================================== -->

            <div
                id="response-container"
                class="response-container"
            >

                <div class="response-header">

                    <span class="response-icon">
                        🤖
                    </span>

                    <h3>
                        Resposta do Gemini
                    </h3>

                </div>


                <div
                    id="response"
                    class="response"
                >
                    <p class="response-placeholder">
                        A resposta da inteligência artificial aparecerá aqui.
                    </p>
                </div>

            </div>


        </section>

    </main>



    <!-- ==========================================
         RODAPÉ
    =========================================== -->

    <footer class="footer">

        <p>
            Desenvolvido pelo grupo
            <strong>18 Bits</strong>
        </p>

        <p>
            Projeto Gemini Chatbot
        </p>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script
        src="./script.js"
    ></script>

</body>

</html>
